<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Garden | Dự án 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50">

    <h1>Bai Kiem Tra - DH52200547</h1>

    <nav class="bg-white shadow-lg p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-600">Flower Garden</h1>
        <div class="bg-blue-300 px-3 py-1 rounded font-bold text-sm md:text-base">
            ban canh Hoa
        </div>
    </nav>

    <header class="text-center py-12 bg-blue-200">
        <h2 class="text-3xl font-serif text-blue-800">
            Trao gửi yêu thương qua từng cánh hoa
        </h2>
        <p class="mt-2 text-blue-600">Giao hàng nhanh trong 2h</p>
    </header>

    <div class="max-w-6xl mx-auto p-6 grid grid-cols-2 md:grid-cols-4 gap-6">
        <div class="bg-white p-4 rounded-xl shadow text-center">
            <div class="text-5xl mb-2">🌹</div>
            <h3 class="font-bold">Hoa Hồng Đỏ</h3>
            <p class="text-blue-500 font-bold">500.000đ</p>
            <button class="mt-2 bg-blue-600 text-white px-4 py-1 rounded-full text-sm">
                Mua ngay
            </button>
        </div>

        <div class="bg-white p-4 rounded-xl shadow text-center">
            <div class="text-5xl mb-2">🌻</div>
            <h3 class="font-bold">Hướng Dương</h3>
            <p class="text-blue-500 font-bold">350.000đ</p>
            <button class="mt-2 bg-blue-600 text-white px-4 py-1 rounded-full text-sm">
                Mua ngay
            </button>
        </div>

        <div class="bg-white p-4 rounded-xl shadow text-center">
            <div class="text-5xl mb-2">🌷</div>
            <h3 class="font-bold">Hoa Tulip</h3>
            <p class="text-blue-500 font-bold">450.000đ</p>
            <button class="mt-2 bg-blue-600 text-white px-4 py-1 rounded-full text-sm">
                Mua ngay
            </button>
        </div>

        <div class="bg-white p-4 rounded-xl shadow text-center">
            <div class="text-5xl mb-2">🌸</div>
            <h3 class="font-bold">Lan Hồ Điệp</h3>
            <p class="text-blue-500 font-bold">1.200.000đ</p>
            <button class="mt-2 bg-blue-600 text-white px-4 py-1 rounded-full text-sm">
                Mua ngay
            </button>
        </div>
    </div>

</body>
</html>
